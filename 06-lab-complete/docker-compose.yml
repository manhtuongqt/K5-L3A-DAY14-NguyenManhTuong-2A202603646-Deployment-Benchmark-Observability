# Chạy agent + redis bằng một lệnh:  docker compose up --build
# AGENT_API_KEY lấy từ file .env hoặc từ shell:  AGENT_API_KEY=xxx docker compose up
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # không có file .env vẫn chạy được
    environment:
      # Trong compose, Redis nằm ở host "redis" (tên service), không phải localhost
      REDIS_URL: redis://redis:6379/0
      # Rỗng nếu chưa đặt → agent từ chối mọi request (an toàn), không có key mặc định
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy   # chờ Redis trả lời PING rồi mới start agent

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
