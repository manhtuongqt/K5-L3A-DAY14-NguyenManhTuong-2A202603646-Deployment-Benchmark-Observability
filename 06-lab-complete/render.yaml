# Render Blueprint cho agent (Dashboard → New → Blueprint → chọn repo).
# File này nằm trong thư mục con, nên rootDir trỏ vào 06-lab-complete;
# dockerfilePath và dockerContext tính tương đối so với rootDir.
# Các chi tiết riêng của Render (tên field, region, plan free) sẽ được kiểm chứng khi deploy thật (CP6).
services:
  - type: web
    name: ai-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true      # Render tự sinh key ngẫu nhiên, không ghi trong repo
      - key: REDIS_URL
        fromService:             # lấy địa chỉ từ Key Value bên dưới
          type: keyvalue
          name: agent-redis
          property: connectionString

  # Redis-compatible (Render Key Value)
  - type: keyvalue
    name: agent-redis
    plan: free
    region: singapore
    ipAllowList: []              # chỉ cho service nội bộ của Render kết nối
